name: Build & Publish

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  check_version:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Read version from main
        id: mainver
        run: |
          VER=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: pr
      - name: Read version from PR
        id: prver
        run: |
          VER=$(grep "^mod_version=" pr/gradle.properties | cut -d'=' -f2)
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Compare versions
        run: |
          MAIN=${{ steps.mainver.outputs.version }}
          DEV=${{ steps.prver.outputs.version }}
          if [ "$MAIN" = "$DEV" ]; then
            echo "❌ ERROR: mod_version not incremented!"
            exit 1
          fi
          echo "✔️ Version incremented — PR OK."

  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew build

      - name: Extract Mod Version
        id: modversion
        run: |
          VER=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          echo "version=$VER" >> $GITHUB_OUTPUT  

      # --------------------------------------------------------
      # 1) Publish FABRIC
      # --------------------------------------------------------
      - name: Publish Fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: explosiveaircraft
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1539363
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Only pick up the Fabric JAR
          files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar

          name: "[Fabric] Explosive Aircraft ${{ steps.modversion.outputs.version }}"
          version: ${{ steps.modversion.outputs.version }}+fabric
          version-type: release
          changelog-file: CHANGELOG.*

          loaders: fabric
          game-versions: 1.21.1
          java: 21
          dependencies: |
            architectury-api (required)
            immersive-aircraft (required)

      # --------------------------------------------------------
      # 2) Publish NEOFORGE
      # --------------------------------------------------------
      - name: Publish NeoForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: explosiveaircraft
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1539363
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Only pick up the NeoForge JAR
          files: neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar

          name: "[NeoForge] Explosive Aircraft ${{ steps.modversion.outputs.version }}"
          version: ${{ steps.modversion.outputs.version }}+neoforge
          version-type: release
          changelog-file: CHANGELOG.*

          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            architectury-api (required)
            immersive-aircraft (required)